{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — SmartOLT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background: linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#1d4ed8 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.reg-card { background:#fff; border-radius:18px; padding:40px 36px; width:100%; max-width:460px; box-shadow:0 24px 64px rgba(0,0,0,0.25); }
.brand { font-size:1.5rem; font-weight:900; color:#1d4ed8; letter-spacing:-0.03em; }
.brand span { color:#f59e0b; }
.form-control { border-radius:8px; border:1.5px solid #e2e8f0; padding:10px 14px; font-size:0.9rem; }
.form-control:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.12); }
.btn-register { background:#1d4ed8; color:#fff; border:none; border-radius:8px; padding:11px; font-weight:700; font-size:0.95rem; width:100%; }
.btn-register:hover { background:#1e40af; color:#fff; }
.divider { border-top:1px solid #f1f5f9; margin:20px 0; }
</style>
</head>
<body>
<div class="reg-card">
  <div class="text-center mb-4">
    <div class="brand mb-1">Smart<span>OLT</span></div>
    <div style="font-size:0.82rem;color:#94a3b8;">Create your account to manage your OLTs</div>
  </div>

  {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }} py-2 mb-3" style="font-size:0.85rem;">{{ msg }}</div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-600" style="font-size:0.85rem;font-weight:600;">Username <span class="text-danger">*</span></label>
      <input type="text" name="username" class="form-control" placeholder="e.g. john_doe" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:0.85rem;font-weight:600;">Email</label>
      <input type="email" name="email" class="form-control" placeholder="you@example.com">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:0.85rem;font-weight:600;">Organization</label>
      <input type="text" name="organization" class="form-control" placeholder="Your company or ISP name">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-size:0.85rem;font-weight:600;">Password <span class="text-danger">*</span></label>
      <input type="password" name="password1" class="form-control" placeholder="Min. 8 characters" required>
    </div>
    <div class="mb-4">
      <label class="form-label" style="font-size:0.85rem;font-weight:600;">Confirm Password <span class="text-danger">*</span></label>
      <input type="password" name="password2" class="form-control" placeholder="Repeat password" required>
    </div>
    <button type="submit" class="btn-register">
      <i class="fa-solid fa-user-plus me-2"></i>Create Account
    </button>
  </form>

  <div class="divider"></div>
  <div class="text-center" style="font-size:0.85rem;color:#64748b;">
    Already have an account? <a href="{% url 'login' %}" style="color:#1d4ed8;font-weight:600;">Sign in</a>
  </div>
</div>
</body>
</html>
