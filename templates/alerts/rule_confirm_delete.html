{% extends 'base.html' %}
{% block title %}Delete Rule{% endblock %}
{% block breadcrumbs %}<li class="breadcrumb-item"><a href="{% url 'rules_list' %}">Alert Rules</a></li><li class="breadcrumb-item active">Delete</li>{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-styled border-danger">
      <div class="card-body text-center py-5">
        <div class="text-danger mb-3" style="font-size:3rem;"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h5>Delete Alert Rule</h5>
        <p class="text-muted mb-4">Delete rule "<strong>{{ rule.name }}</strong>"?<br><span class="text-danger fw-bold">This cannot be undone.</span></p>
        <form method="post" class="d-inline">{% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Delete</button>
        </form>
        <a href="{% url 'rules_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
